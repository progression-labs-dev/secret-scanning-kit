name: Secret scan (full history)
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  gitleaks-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          DIGEST=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          echo "$DIGEST  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full history
        id: scan
        run: |
          set +e
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --no-banner \
            --exit-code 3 --ignore-gitleaks-allow
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Alert when a key is found
        if: steps.scan.outputs.code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSIGNEE: ${{ vars.SECRET_SCAN_ASSIGNEE }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          TITLE="Secret scan found a key"
          BOT="app/github-actions"
          OPEN=$(gh issue list --state open --limit 200 --json number,title,author \
            --jq "[.[] | select(.title == \"$TITLE\" and .author.login == \"$BOT\")] | .[0].number // empty")
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "Found again. Run $RUN_URL"
          elif [ -n "$ASSIGNEE" ] \
            && gh api "repos/$GITHUB_REPOSITORY/assignees/$ASSIGNEE" --silent 2>/dev/null; then
            gh issue create --title "$TITLE" --assignee "$ASSIGNEE" --body "Run $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "Run $RUN_URL"
          fi
      - name: Fail the run if the scan did not pass
        if: steps.scan.outputs.code != '0'
        run: exit 1
